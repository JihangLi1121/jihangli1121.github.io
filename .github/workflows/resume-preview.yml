name: Refresh résumé

# The site links one fixed path, resume.pdf, so nothing breaks when the
# exported file gets a new name. Drop any PDF whose name contains "resume"
# into the repo root, push, and this normalises it to resume.pdf and rebuilds
# the vector conversion that resume.html displays.
#
# The preview exists because <object>/<iframe> PDF embedding draws an empty
# box in some browsers while still reporting that it works. The cost of that
# choice is a stale image, which is what this removes.

on:
  push:
    paths:
      - "*.pdf"
  workflow_dispatch:

permissions:
  contents: write
  pages: write        # to request a rebuild after the bot's push

concurrency:
  group: resume-preview
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalise the filename
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob
          incoming=()
          for f in *resume*.pdf; do
            [ "$f" = "resume.pdf" ] && continue
            incoming+=("$f")
          done
          if [ ${#incoming[@]} -eq 0 ]; then
            echo "no newly named résumé; using resume.pdf as-is"
          else
            if [ ${#incoming[@]} -gt 1 ]; then
              echo "::warning::several résumé PDFs present (${incoming[*]}); taking the last"
            fi
            src="${incoming[${#incoming[@]}-1]}"
            git mv -f "$src" resume.pdf
            echo "renamed $src -> resume.pdf"
          fi
          test -f resume.pdf || { echo "::error::no resume.pdf to render"; exit 1; }

      - name: Install the PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Convert the PDF to vector
        run: |
          set -euo pipefail
          mkdir -p assets/media
          # Lives under .github/ because it is deployment machinery, not part of
          # the site. It stacks every page into one SVG, which is why resume.html
          # needs no change when the résumé grows a second page.
          python3 .github/scripts/make_resume_svg.py resume.pdf assets/media/resume-preview.svg
          # the raster pipeline this replaced
          rm -f assets/media/resume-preview.png assets/media/resume-preview.jpg
          ls -l resume.pdf assets/media/resume-preview.svg

      - name: Commit if anything changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # naming the retired raster files here would abort the step: git add
          # fails on a pathspec that matches nothing, and they are gone now.
          # Staging the directory still records their deletion.
          git add -A -- resume.pdf assets/media
          git add -A -- '*.pdf'
          if git diff --cached --quiet; then
            echo "already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh résumé and preview [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger a Pages
      # build — it is recorded as errored in 0 ms and the site keeps serving
      # the old file until somebody pushes by hand. Ask for the build so the
      # new résumé actually goes live.
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
          echo "requested a Pages build"
