<style>
:root{
  --ground:#070B0D;--panel:#0E1518;--line:#1C2A2E;--line-2:#26383D;
  --text:#DCE8E5;--muted:#93A5A3;--muted-2:#6C7E7C;--accent:#4FF0C1;--accent-rgb:79,240,193;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Avenir Next Condensed","Futura","Trebuchet MS",system-ui,sans-serif;
  --body:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#EFF2ED;--panel:#E4E9E3;--line:#C7D2CA;--line-2:#AEBDB2;
    --text:#101A18;--muted:#4A5C57;--muted-2:#6C7E7C;--accent:#0B7F63;--accent-rgb:11,127,99;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
/* the sheet is taller than the viewport — let the document scroll rather than
   pinning body to 100% height, which made the footer sit over the page */
body{margin:0;min-height:100vh;background:var(--ground);color:var(--text);
  font-family:var(--body);display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem .8rem;
  padding:.85rem clamp(1rem,4vw,2rem);border-bottom:1px solid var(--line);
  background:var(--ground);position:sticky;top:0;z-index:2}
.bar__id{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted-2);margin-right:.4rem}
.bar__id b{color:var(--text);font-weight:400}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  text-decoration:none;padding:.55rem .85rem;border:1px solid var(--line);color:var(--muted);
  display:inline-flex;align-items:center;gap:.45rem;
  transition:color .25s,border-color .25s,background-color .25s}
.btn:hover{color:var(--text);border-color:var(--line-2)}
.btn--solid{background:var(--accent);color:#04120E;border-color:var(--accent);font-weight:600}
.btn--solid:hover{filter:brightness(1.08);color:#04120E}
.spacer{margin-left:auto}

.stage{flex:1 1 auto;padding:clamp(.75rem,2.5vw,1.5rem);display:flex;justify-content:center}
.doc{width:min(880px,100%);background:#fff;border:1px solid var(--line-2);
  box-shadow:0 24px 60px -30px rgba(0,0,0,.9);height:fit-content}
.page{display:block;position:relative;text-decoration:none}
.page img{width:100%;height:auto;display:block}
.page__hint{position:absolute;right:.9rem;bottom:.9rem;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(7,11,13,.86);color:#DCE8E5;padding:.5rem .75rem;
  opacity:0;transition:opacity .25s}
.page:hover .page__hint,.page:focus-visible .page__hint{opacity:1}

.note{padding:.7rem clamp(1rem,4vw,2rem);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted-2);display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:space-between}

@media print{
  /* printing this wrapper is never what anyone wants — send them to the PDF */
  .bar,.note{display:none}
  body{background:#fff}
  .stage{padding:0}
  .doc{border:0;box-shadow:none}
}
</style>
</head>
<body>

<header class="bar">
  <span class="bar__id">Jihang Li · <b>Résumé 2026</b></span>
  <a class="btn" href="./">&larr; Back to the site</a>
  <span class="spacer"></span>
  <a class="btn" href="resume.pdf" target="_blank" rel="noopener">Open in new tab</a>
  <a class="btn btn--solid" href="resume.pdf" download="Jihang_Li_Resume.pdf">
    Download PDF
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor"
         stroke-width="1.5" aria-hidden="true"><path d="M7 1.5v8M3.5 6.5 7 10l3.5-3.5M2 12h10"/></svg>
  </a>
</header>

<main class="stage">
  <div class="doc">
    <!-- A rendered page, not an embed. <object>/<iframe> PDF viewers were
         tested and drew an empty grey box while still reporting
         navigator.pdfViewerEnabled === true, so there is no reliable way to
         detect the failure and fall back. This image is the PDF itself,
         rendered at 2000px; the buttons above open and download the real file. -->
    <a class="page" href="resume.pdf" target="_blank" rel="noopener"
       aria-label="Open the résumé PDF">
      <img src="assets/media/resume-preview.png"
           alt="Résumé of Jihang Li — Summary, Education, Technical Skills, Experience and Projects">
      <span class="page__hint">Open the PDF &rarr;</span>
    </a>
  </div>
</main>


<p class="note">
  <span>Rendered from the PDF · updated 2026</span>
  <span>jihangli1121.github.io</span>
</p>

</body>
